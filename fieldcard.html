.ms-po__sheet{background:#fff;color:#12352B;width:100%;max-width:440px;max-height:92vh;overflow-y:auto;box-sizing:border-box;border-radius:18px 18px 0 0;padding:24px 22px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(18,53,43,.25);transform:translateY(100%);transition:transform .28s ease-out}
.ms-po[data-open] .ms-po__sheet{transform:none}
@media (min-width:600px){.ms-po{align-items:center}.ms-po__sheet{border-radius:18px}}
@media (prefers-reduced-motion:reduce){.ms-po,.ms-po__sheet{transition:none}}
.ms-po__score{display:flex;align-items:baseline;gap:8px;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid #E1E3E1}
.ms-po__num{font-size:56px;line-height:1;font-weight:800;letter-spacing:-.02em}
.ms-po__of{font-size:20px;font-weight:600;color:#78847C;white-space:nowrap}
.ms-po__disc{margin-left:auto;font-size:14px;line-height:1.35;color:#78847C;text-align:right}
.ms-po h2{font-size:22px;line-height:1.2;margin:0 0 8px;color:#12352B}
.ms-po p{font-size:15px;line-height:1.45;margin:0 0 14px;color:#2A4941}
.ms-po__price{background:#E9F5ED;border-radius:10px;padding:12px 14px;margin:0 0 16px;font-size:15px;line-height:1.4;color:#12352B}
.ms-po__price strong{font-size:18px}
.ms-po__field{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
.ms-po__opt{font-weight:400;color:#78847C}
.ms-po__input{display:block;width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:12px;margin:0 0 12px;border:1.5px solid #78847C;border-radius:8px;color:#12352B;background:#fff}
.ms-po__check{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4;margin:2px 0 14px;color:#2A4941}
.ms-po__check input{margin:2px 0 0;width:18px;height:18px;flex:none;accent-color:#12352B}
.ms-po__go{display:block;width:100%;font:inherit;font-size:16px;font-weight:700;padding:14px;border:0;border-radius:10px;background:#12352B;color:#fff;cursor:pointer}
.ms-po__go[disabled]{opacity:.6;cursor:default}
.ms-po__later{display:block;margin:10px auto 0;padding:6px;background:none;border:0;font:inherit;font-size:14px;color:#78847C;text-decoration:underline;cursor:pointer}
.ms-po__err{color:#C11922;font-size:14px;min-height:1em;margin:0 0 10px}
.ms-po__small{font-size:12px;line-height:1.4;color:#78847C;margin:12px 0 0}
.ms-po__small a{color:inherit}
.ms-po__badge{display:inline-block;background:#12352B;color:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;margin:0 0 12px}
.ms-po input:focus-visible,.ms-po button:focus-visible,.ms-po a:focus-visible{outline:3px solid #C11922;outline-offset:2px}
</style>
<script>
(function () {
  /* ---- Settings ---- */
  var ENDPOINT = 'https://script.google.com/macros/s/AKfycbzBlgk74TpG-b2KPGFpzYCDoPYtKbtUL_ZGMjcFygkmEPiNlrVZDJedt4TBHjV0H35Y/exec';
  var PRIVACY_URL = 'https://clubs.myshoots.io/privacy';
  var SHARE_URL = 'https://scorecard.myshoots.io/fieldcard.html';
  var SNOOZE_DAYS = 7;
  var K_ME = 'msFoundingPro', K_SNOOZE = 'msProOfferSnooze', K_REFBY = 'msReferredBy';

  function save(k, v) { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function track(name) { try { if (window.umami) umami.track(name); } catch (e) {} }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function newRef() { return 'ms' + Math.random().toString(36).slice(2, 8); }

  // Remember who referred this shooter (from ?ref= on the link a mate shared)
  try {
    var arrivedRef = new URLSearchParams(location.search).get('ref');
    if (arrivedRef && !load(K_REFBY)) save(K_REFBY, arrivedRef.slice(0, 20));
  } catch (e) {}

  function send(data) {
    if (window.MS_PO_DEMO) return new Promise(function (r) { setTimeout(r, 600); });
    if (ENDPOINT.indexOf('https://') !== 0) return Promise.reject(new Error('Endpoint not set'));
    return fetch(ENDPOINT, { method: 'POST', mode: 'no-cors', body: new URLSearchParams(data) });
  }
  function roundData(r) {
    return {
      discipline: r.discipline || '', score: r.score == null ? '' : r.score, targets: r.targets || '',
      source: 'Field Card',
      ground: r.ground || '', roundDate: r.date || new Date().toISOString().slice(0, 10),
      unit: r.unit || ''
    };
  }

  /* ---- Sheet ---- */
  var root = document.createElement('div');
  root.className = 'ms-po';
  root.hidden = true;
  root.setAttribute('role', 'dialog');
  root.setAttribute('aria-modal', 'true');
  root.setAttribute('aria-labelledby', 'ms-po-title');
  document.body.appendChild(root);
  var lastFocus = null;

  function open(html) {
    lastFocus = document.activeElement;
    root.innerHTML = '<div class="ms-po__sheet">' + html + '</div>';
    root.hidden = false;
    requestAnimationFrame(function () { requestAnimationFrame(function () { root.setAttribute('data-open', ''); }); });
    var first = root.querySelector('input, .ms-po__go');
    if (first) setTimeout(function () { first.focus(); }, 50);
  }
  function close() {
    root.removeAttribute('data-open');
    root.hidden = true;
    root.innerHTML = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function notNow() { save(K_SNOOZE, Date.now()); track('pro-offer-dismissed'); close(); }

  root.addEventListener('click', function (e) { if (e.target === root) notNow(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !root.hidden) notNow(); });

  function scoreBlock(r) {
    if (r.score == null || r.score === '') return '';
    var side = [r.label || r.discipline, r.ground].filter(Boolean).map(esc).join('<br>');
    return '<div class="ms-po__score"><span class="ms-po__num">' + esc(r.score) + '</span>' +
      (r.targets ? '<span class="ms-po__of">/ ' + esc(r.targets) + '</span>' : (r.unit ? '<span class="ms-po__of">' + esc(r.unit) + '</span>' : '')) +
      (side ? '<span class="ms-po__disc">' + side + '</span>' : '') + '</div>';
  }

  /* ---- First-time offer ---- */
  function offer(r) {
    track('pro-offer-shown');
    open(
      scoreBlock(r) +
      '<h2 id="ms-po-title">Keep this day</h2>' +
      '<p>Reserve your place as a Founding Pro and this day, plus every day you save from now, carries into MyShoots® Pro at launch, building your record over the season.</p>' +
      '<div class="ms-po__price"><strong>£1.99 a month</strong> for your first 12 months, then £4.99. No card and no payment today.</div>' +
      '<form novalidate>' +
        '<label class="ms-po__field" for="ms-po-email">Email</label>' +
        '<input class="ms-po__input" id="ms-po-email" type="email" autocomplete="email" inputmode="email" required>' +
        '<label class="ms-po__field" for="ms-po-name">First name <span class="ms-po__opt">(optional)</span></label>' +
        '<input class="ms-po__input" id="ms-po-name" type="text" autocomplete="given-name">' +
        '<label class="ms-po__check"><input type="checkbox" id="ms-po-news"> Send me the Monthly Events Digest and MyShoots® news. Unsubscribe any time.</label>' +
        '<p class="ms-po__err" aria-live="polite"></p>' +
        '<button class="ms-po__go" type="submit">Reserve my founding rate</button>' +
      '</form>' +
      '<button class="ms-po__later" type="button">Not now</button>' +
      '<p class="ms-po__small">We use your email for your Founding Pro reservation and the days you save. <a href="' + PRIVACY_URL + '" target="_blank" rel="noopener">Privacy policy</a></p>'
    );
    root.querySelector('.ms-po__later').onclick = notNow;
    root.querySelector('form').onsubmit = function (e) {
      e.preventDefault();
      var email = root.querySelector('#ms-po-email').value.trim();
      var err = root.querySelector('.ms-po__err');
      var btn = root.querySelector('.ms-po__go');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = 'Enter an email address like name@example.com.'; return; }
      err.textContent = '';
      btn.disabled = true; btn.textContent = 'Reserving…';
      var ref = newRef();
      var data = roundData(r);
      data.type = 'signup';
      data.source = 'Field Card';
      data.email = email;
      data.name = root.querySelector('#ms-po-name').value.trim();
      data.news = root.querySelector('#ms-po-news').checked ? 'yes' : 'no';
      data.ref = ref;
      data.referredBy = load(K_REFBY) || '';
      send(data).then(function () {
        save(K_ME, { email: email, ref: ref });
        save(K_SNOOZE);
        track('pro-offer-reserved');
        reserved(ref, r);
      }).catch(function () {
        btn.disabled = false; btn.textContent = 'Reserve my founding rate';
        err.textContent = 'Couldn’t reach MyShoots®. Check your signal and try again.';
      });
    };
  }

  /* ---- Confirmation + referral ---- */
  function reserved(ref, r) {
    var hasRound = r && r.score != null && r.score !== '';
    open(
      '<span class="ms-po__badge">Founding Pro</span>' +
      '<h2 id="ms-po-title">You’re in</h2>' +
      '<p>Your rate is locked at £1.99 a month for 12 months' + (hasRound ? ', and this day is saved to your Founding record' : '') + '. We’ll email you before launch.</p>' +
      '<div class="ms-po__price">Get two mates to sign up and keep £1.99 for 18 months instead of 12.</div>' +
      '<button class="ms-po__go" type="button">Share the Field Card</button>' +
      '<button class="ms-po__later" type="button">Done</button>'
    );
    var shareBtn = root.querySelector('.ms-po__go');
    root.querySelector('.ms-po__later').onclick = close;
    shareBtn.onclick = function () {
      var url = SHARE_URL + '?ref=' + encodeURIComponent(ref);
      var text = 'I’m recording my game days on the free MyShoots® Field Card. Try it:';
      track('pro-offer-shared');
      if (navigator.share) {
        navigator.share({ title: 'MyShoots® Field Card', text: text, url: url }).catch(function () {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(text + ' ' + url).then(function () { shareBtn.textContent = 'Link copied'; });
      } else {
        prompt('Copy this link:', url);
      }
    };
  }

  /* ---- Returning Founding Pro: one-tap save ---- */
  function saveRound(r, me) {
    if (r.score == null || r.score === '') return;
    open(
      scoreBlock(r) +
      '<h2 id="ms-po-title">Save this day?</h2>' +
      '<p>Add it to your Founding record so it’s there when MyShoots® Pro launches.</p>' +
      '<p class="ms-po__err" aria-live="polite"></p>' +
      '<button class="ms-po__go" type="button">Save day</button>' +
      '<button class="ms-po__later" type="button">Not now</button>'
    );
    var btn = root.querySelector('.ms-po__go');
    root.querySelector('.ms-po__later').onclick = close;
    btn.onclick = function () {
      btn.disabled = true; btn.textContent = 'Saving…';
      var data = roundData(r);
      data.type = 'round';
      data.email = me.email;
      send(data).then(function () {
        track('round-saved');
        btn.textContent = 'Saved to your Founding record';
        setTimeout(close, 1400);
      }).catch(function () {
        btn.disabled = false; btn.textContent = 'Save day';
        root.querySelector('.ms-po__err').textContent = 'Couldn’t reach MyShoots®. Check your signal and try again.';
      });
    };
  }

  /* ---- Public ---- */
  window.MyShootsProOffer = {
    show: function (r) {
      r = r || {};
      var me = load(K_ME);
      if (me && me.email) return saveRound(r, me);
      var snoozed = load(K_SNOOZE);
      if (snoozed && Date.now() - snoozed < SNOOZE_DAYS * 864e5) return;
      offer(r);
    },
    // From a button the shooter tapped: ignores the 7-day "Not now" pause
    open: function (r) {
      r = r || {};
      var me = load(K_ME);
      if (me && me.email) return saveRound(r, me);
      offer(r);
    },
    // For testing: MyShootsProOffer.reset() clears this browser's state
    reset: function () { save(K_ME); save(K_SNOOZE); save(K_REFBY); }
  };
})();
</script>
</body>
</html>
